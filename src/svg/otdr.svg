<svg class="dg" viewBox="0 0 451 360" role="img" aria-labelledby="dg-otdr-t" xmlns="http://www.w3.org/2000/svg">
  <title id="dg-otdr-t">Křivka měření OTDR na 1310 nm: konektor, svar s útlumem 0,03 dB a konec vlákna</title>
  <style>.dg-ttl{font:500 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}.dg-t{font:400 13px var(--mono);fill:var(--muted)}.dg-ink{fill:var(--ink)}.dg-n{font:400 13px var(--mono);fill:var(--accent)}.dg-ln{fill:none;stroke:var(--ink);stroke-width:1.5}.dg-thin{fill:none;stroke:var(--line);stroke-width:1}.dg-thin-ink{fill:none;stroke:var(--ink);stroke-width:1}.dg-grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}.dg-duct{fill:none;stroke:var(--photo);stroke-width:9;stroke-linecap:round}.dg-box{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.dg-pt{fill:var(--accent)}.dg-ev{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.6}.dg-trace{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}.dg-bg{fill:var(--card)}.dg-sheet{fill:var(--card);stroke:var(--ink);stroke-width:1}</style>
  <text class="dg-ttl" x="24" y="34">OTDR · 1310 nm · A→B</text>
  <!-- mřížka -->
  <g class="dg-grid">
    <line x1="56" y1="60" x2="427" y2="60"/><line x1="56" y1="120" x2="427" y2="120"/><line x1="56" y1="180" x2="427" y2="180"/><line x1="56" y1="240" x2="427" y2="240"/>
    <line x1="130" y1="60" x2="130" y2="292"/><line x1="204" y1="60" x2="204" y2="292"/><line x1="278" y1="60" x2="278" y2="292"/><line x1="352" y1="60" x2="352" y2="292"/>
  </g>
  <line class="dg-thin-ink" x1="56" y1="60" x2="56" y2="292"/>
  <line class="dg-thin-ink" x1="56" y1="292" x2="427" y2="292"/>
  <text class="dg-t" x="24" y="66">dB</text>
  <text class="dg-t" x="56" y="314" text-anchor="middle">0</text>
  <text class="dg-t" x="130" y="314" text-anchor="middle">0,1</text>
  <text class="dg-t" x="204" y="314" text-anchor="middle">0,2</text>
  <text class="dg-t" x="278" y="314" text-anchor="middle">0,3</text>
  <text class="dg-t" x="352" y="314" text-anchor="middle">0,4</text>
  <text class="dg-t" x="427" y="314" text-anchor="end">km</text>
  <!-- události: konektor 0,05 km, svar ve spojce 0,2 km, konec vlákna 0,35 km -->
  <line class="dg-ev" x1="93" y1="60" x2="93" y2="292"/>
  <line class="dg-ev" x1="204" y1="60" x2="204" y2="292"/>
  <line class="dg-ev" x1="315" y1="60" x2="315" y2="292"/>
  <!-- křivka -->
  <path class="dg-trace" d="M56 66 L59 70 L62 92 L66 96 L93 99 L93 80 L96 84 L99 104 L204 114 L207 119 L315 129 L315 100 L318 104 L323 262 L330 270 L337 266 L344 276 L352 268 L360 278 L368 270 L376 280 L384 272 L392 279 L400 271 L408 280 L416 273 L427 279"/>
  <circle class="dg-pt" cx="93" cy="80" r="3.5"/>
  <circle class="dg-pt" cx="205" cy="116" r="3.5"/>
  <circle class="dg-pt" cx="315" cy="100" r="3.5"/>
  <rect class="dg-bg" x="57" y="152" width="72" height="18"/>
  <text class="dg-t" x="93" y="165" text-anchor="middle">konektor</text>
  <rect class="dg-bg" x="156" y="178" width="96" height="18"/>
  <text class="dg-t" x="204" y="191" text-anchor="middle">svar 0,03 dB</text>
  <rect class="dg-bg" x="285" y="204" width="60" height="18"/>
  <text class="dg-t" x="315" y="217" text-anchor="middle">konec</text>
  <text class="dg-t" x="427" y="344" text-anchor="end">protokol ke každému vláknu</text>
</svg>
