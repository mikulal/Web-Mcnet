<svg class="dg" viewBox="0 0 641 360" role="img" aria-labelledby="dg-trasa-t" xmlns="http://www.w3.org/2000/svg">
  <title id="dg-trasa-t">Schéma optické trasy: rozvaděč R1, mikrotrubička vedená po technologickém mostě, spojka uprostřed, rozvaděč R2</title>
  <text class="dg-ttl" x="24" y="34">Situace trasy · schéma</text>
  <!-- terén -->
  <line class="dg-thin" x1="24" y1="292" x2="617" y2="292"/>
  <!-- technologický most -->
  <rect class="dg-thin" x="150" y="110" width="340" height="12"/>
  <path class="dg-thin" d="M150 122 L184 110 L218 122 L252 110 L286 122 L320 110 L354 122 L388 110 L422 122 L456 110 L490 122"/>
  <line class="dg-thin" x1="172" y1="122" x2="172" y2="292"/>
  <line class="dg-thin" x1="468" y1="122" x2="468" y2="292"/>
  <text class="dg-t" x="180" y="168">technologický most</text>
  <!-- rozvaděče -->
  <rect class="dg-ln" x="48" y="188" width="56" height="104"/>
  <line class="dg-thin" x1="48" y1="210" x2="104" y2="210"/><line class="dg-thin" x1="48" y1="232" x2="104" y2="232"/><line class="dg-thin" x1="48" y1="254" x2="104" y2="254"/>
  <rect class="dg-ln" x="537" y="188" width="56" height="104"/>
  <line class="dg-thin" x1="537" y1="210" x2="593" y2="210"/><line class="dg-thin" x1="537" y1="232" x2="593" y2="232"/><line class="dg-thin" x1="537" y1="254" x2="593" y2="254"/>
  <text class="dg-t" x="48" y="314">R1 · vana 24× SC</text>
  <text class="dg-t" x="593" y="314" text-anchor="end">R2 · vana 24× SC</text>
  <!-- chránička a kabel -->
  <path class="dg-duct" d="M76 188 V140 Q76 102 114 102 H527 Q565 102 565 140 V188"/>
  <path class="dg-ln" d="M76 188 V140 Q76 102 114 102 H527 Q565 102 565 140 V188"/>
  <text class="dg-t" x="320" y="146" text-anchor="middle">mikrotrubička 14/10 · mikrokabel 24 vl. G.657A1</text>
  <!-- spojka -->
  <rect class="dg-box" x="304" y="95" width="32" height="14"/>
  <text class="dg-t" x="320" y="82" text-anchor="middle">spojka · 24 svarů</text>
  <circle class="dg-pt" cx="76" cy="188" r="3.5"/>
  <circle class="dg-pt" cx="565" cy="188" r="3.5"/>
  <!-- kóta -->
  <line class="dg-thin" x1="76" y1="338" x2="565" y2="338"/>
  <line class="dg-thin" x1="76" y1="332" x2="76" y2="344"/><line class="dg-thin" x1="565" y1="332" x2="565" y2="344"/>
  <rect class="dg-bg" x="226" y="328" width="188" height="20"/>
  <text class="dg-t" x="320" y="342" text-anchor="middle">L ≈ 300 m</text>
